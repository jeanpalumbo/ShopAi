<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina de agentes</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink:#2b2d4a; --paper:#fbf3e2; --card:#fff; --muted:#7a7a90; --work:#f6b24a; --idle:#8fa3b8; --block:#d9534f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: ui-monospace, "Courier New", monospace; }
  header { background:var(--ink); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .pill { background:#4a4c6a; border-radius:999px; padding:6px 12px; font-size:13px; }
  .demo { background:#fff3cd; color:#6b4e00; padding:6px 20px; font-size:12px; border-bottom:1px solid #e6d28a; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:16px; padding:16px; align-items:start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .stage { position:relative; background:#000; border:4px solid var(--ink); border-radius:6px; }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  .hint { font-size:12px; color:var(--muted); margin:8px 2px; }
  aside { background:var(--card); border:3px solid var(--ink); border-radius:10px; padding:14px; }
  aside h2 { margin:0 0 4px; font-size:17px; }
  .role { color:var(--muted); font-size:13px; margin-bottom:10px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:var(--idle); }
  .dot.working { background:var(--work); } .dot.blocked { background:var(--block); }
  ul { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:6px; }
  li button { width:100%; text-align:left; font:inherit; font-size:13px; padding:7px 9px; border:2px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; color:var(--ink); }
  li button[aria-pressed="true"] { border-color:var(--ink); }
  .pad { display:none; grid-template-columns:repeat(3,52px); gap:4px; justify-content:center; margin:10px 0; }
  @media (pointer: coarse) { .pad { display:grid; } }
  .pad button { height:52px; font-size:20px; border:3px solid var(--ink); background:#fff; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>Oficina de agentes</h1>
  <span class="pill" id="summary">cargando…</span>
</header>
<div class="demo" id="demo" hidden></div>
<main>
  <section>
    <div class="stage"><canvas id="game" tabindex="0" aria-label="Mapa de la oficina"></canvas></div>
    <p class="hint">Mueve con flechas / WASD · Z, Enter o Espacio para hablar con quien tienes delante · clic en un agente para verlo</p>
    <div class="pad" id="pad">
      <span></span><button data-dir="up">▲</button><span></span>
      <button data-dir="left">◀</button><button id="act">A</button><button data-dir="right">▶</button>
      <span></span><button data-dir="down">▼</button><span></span>
    </div>
  </section>
  <aside>
    <h2 id="p-name">Elige un agente</h2>
    <div class="role" id="p-role"></div>
    <div id="p-state"></div>
    <ul id="roster"></ul>
  </aside>
</main>
<script type="module" src="/office.js"></script>
</body>
</html>
